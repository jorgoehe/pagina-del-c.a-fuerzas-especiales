    <main class="page-content">
    <section id="socios">
        <h2>Hacete Socio</h2>
        <p>Por favor así me ayudás a pagar la deuda con la AFIP.</p>
        
        <form id="form" class="formulario-socios">
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" required placeholder="Ej: Juan Pérez">
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" required placeholder="tuemail@ejemplo.com">
            </div>
            <div class="form-group">
                <label for="categoria">Categoría de Socio:</label>
                <select id="categoria">
                    <option value="activo">Socio Activo</option>
                    <option value="cadete">Socio Cadete (Menores de 18)</option>
                    <option value="grupo">Grupo Familiar</option>
                </select>
            </div>
            <button type="submit" class="btn-enviar">Asociarme</button>
            <p id="mensaje" aria-live="polite" style="margin-top: 1rem; color: #0b6e40; font-weight: 600;"></p>
        </form>
    </section>
    </main>
    <script src="cacao.js"></script>
